name: Release v1.1.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.1.3
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version and existing tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json).version
          if ($version -ne '1.1.3') {
            "release=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $tag = 'v1.1.3'
          $existing = git rev-parse --verify "refs/tags/$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -ne $env:GITHUB_SHA) {
            if (gh release view $tag --json tagName --jq .tagName 2>$null) {
              "release=false" >> $env:GITHUB_OUTPUT
              exit 0
            }
            throw "Tag $tag exists on another commit without a release."
          }
          "release=true" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Build and verify standalone files
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Create tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.3'
          gh release view $tag --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          $notes = (Get-Content -Raw -Encoding UTF8 CHANGELOG.md) -split '(?m)^## ' | Where-Object { $_ -match '^v1\.1\.3\s' } | Select-Object -First 1
          if (-not $notes) { throw 'v1.1.3 release notes are missing.' }
          $notes | Set-Content -Encoding utf8 release-notes.txt
          gh release create $tag dist/index.html dist/index.self-extract.html --target $env:GITHUB_SHA --title $tag --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
